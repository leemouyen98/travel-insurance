<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Apple semantic palette — light appearance (default) ── */
  --bg:#f2f2f7;             /* systemGroupedBackground */
  --bg-elevated:#ffffff;    /* secondarySystemGroupedBackground */
  --bg-elevated-a:rgba(255,255,255,.78);
  --bg-tertiary:#e5e5ea;    /* systemGray5 */
  --fill:#e9e9eb;           /* systemGray5/6 — received bubble, compose field */
  --label:#000000;
  --label-2:rgba(60,60,67,.6);   /* secondaryLabel */
  --label-3:rgba(60,60,67,.32);  /* tertiaryLabel */
  --separator:rgba(60,60,67,.29);
  --tint:#007aff;           /* systemBlue */
  --tint-deep:#0040dd;
  --tint-wash:rgba(0,122,255,.1);
  --success:#34c759;        /* systemGreen */
  --success-deep:#1f8a3b;
  --warning:#ff9500;        /* systemOrange */
  --destructive:#ff3b30;    /* systemRed */
  --star:#ff9f0a;           /* systemYellow-ish for ratings */

  /* back-compat aliases referenced inline from the conversation engine */
  --brass:var(--tint);
  --wa:var(--success);

  --r:14px;
  --spring:cubic-bezier(.32,.72,0,1);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000000;
    --bg-elevated:#1c1c1e;
    --bg-elevated-a:rgba(28,28,30,.78);
    --bg-tertiary:#2c2c2e;
    --fill:#3a3a3c;
    --label:#ffffff;
    --label-2:rgba(235,235,245,.6);
    --label-3:rgba(235,235,245,.32);
    --separator:rgba(84,84,88,.6);
    --tint:#0a84ff;
    --tint-deep:#5ab0ff;
    --tint-wash:rgba(10,132,255,.16);
    --success:#30d158;
    --success-deep:#30d158;
    --warning:#ff9f0a;
    --destructive:#ff453a;
    --star:#ffd60a;
  }
}
html{font-size:16px}
body{
  background:var(--bg);
  color:var(--label); font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',Arial,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ── Tablet & desktop scale-up ── */
@media(min-width:700px){
  .wrap{max-width:640px}
  .chat-head{padding:1.1rem 1.3rem}
  .thread{padding:1.25rem 1.1rem 0}
  .footer-note{padding:1.3rem 1.1rem 2.2rem}
}
@media(min-width:1000px){
  html{font-size:17px}
  .wrap{max-width:720px}
  .chat-head{padding:1.25rem 1.4rem}
  .thread{padding:1.4rem 1.2rem 0}
  .footer-note{padding:1.4rem 1.2rem 2.4rem}
}

/* ── Header (nav bar) ── */
.chat-head{
  display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;
  border-bottom:.5px solid var(--separator);
  background:var(--bg-elevated-a);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  flex-shrink:0;
}
.back-btn{
  background:none;border:none;color:var(--tint);font-size:1.7rem;font-weight:400;line-height:1;
  cursor:pointer;padding:0 .3rem 0 0;flex-shrink:0;font-family:inherit;transition:opacity .15s var(--spring);
}
.back-btn:hover{opacity:.7}
.back-btn:active{opacity:.45}
.reset-btn{
  background:none;border:none;color:var(--label-3);font-size:.78rem;font-weight:400;
  cursor:pointer;font-family:inherit;flex-shrink:0;white-space:nowrap;transition:color .15s ease;
}
.reset-btn:hover{color:var(--destructive)}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--bg-tertiary);
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:.75rem;color:var(--label-2);
  object-fit:cover;
}
.chat-head-name{font-weight:600;font-size:.98rem;letter-spacing:-.01em}
.beta-badge{
  display:inline-block;margin-left:.4rem;font-size:.62rem;
  letter-spacing:.02em;font-weight:600;color:var(--tint);background:var(--tint-wash);
  border-radius:999px;padding:2px 8px;vertical-align:middle;
}
.chat-head-sub{font-size:.76rem;color:var(--label-2);margin-top:1px}
.chat-head-sub .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:5px;vertical-align:middle;box-shadow:0 0 0 2px var(--bg-elevated)}

/* ── Progress track (Trip / Plan / Details / Pay) ── */
.progress-track{display:flex;gap:4px;padding:.55rem 1.1rem;background:var(--bg-elevated-a);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--separator);flex-shrink:0}
.progress-seg{flex:1;height:4px;border-radius:2px;background:var(--bg-tertiary);transition:background .35s var(--spring)}
.progress-seg.active{background:var(--tint)}
.progress-seg.done{background:var(--tint)}
.head-actions{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.feedback-link{font-size:.78rem;color:var(--tint);text-decoration:none;white-space:nowrap}
.feedback-link:hover{opacity:.7}

/* ── Thread ── */
.thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.1rem .9rem calc(1.5rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.45rem}
.row{display:flex;animation:in .22s var(--spring)}
.row.mine{justify-content:flex-end;align-items:center;gap:.35rem}
.edit-btn{
  background:none;border:none;color:var(--label-3);font-size:.85rem;cursor:pointer;
  flex-shrink:0;line-height:1;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.edit-btn:hover,.edit-btn:active{color:var(--tint)}
.row.theirs{justify-content:flex-start}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bubble{max-width:min(82%,440px);padding:.56rem .85rem;font-size:.96rem;line-height:1.4;border-radius:19px;letter-spacing:-.003em}
.row.theirs .bubble{background:var(--fill);color:var(--label);border-bottom-left-radius:5px}
.row.mine .bubble{background:var(--tint);color:#fff;border-bottom-right-radius:5px;font-weight:400}
.tag{display:inline-block;margin-top:.35rem;font-size:.66rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--label-2);background:rgba(0,0,0,.05);padding:2px 7px;border-radius:5px}

.typing{display:flex;gap:3px;align-items:center;background:var(--fill);padding:.65rem .85rem;border-radius:19px;border-bottom-left-radius:5px;width:fit-content}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--label-3);animation:bounce 1.1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:.9}}
@media(prefers-reduced-motion:reduce){.typing span{animation:none;opacity:.7}.row{animation:none}.optcard,.chip,.plancard{animation:none}}

/* ── Widgets ── */
.widget{padding:.15rem .1rem .2rem;display:flex;flex-direction:column;gap:.55rem}
.chiprow{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  font-family:inherit;font-size:.92rem;font-weight:400;padding:.5rem 1rem;
  border-radius:20px;border:none;color:var(--tint);
  background:var(--bg-elevated);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--separator);
  cursor:pointer;transition:transform .15s var(--spring),opacity .15s ease;
  animation:cardSlideIn .32s var(--spring) both;
}
.chip:hover{opacity:.85}
.chip:active{transform:scale(.96)}
.chip .sub{display:block;font-size:.68rem;color:var(--label-3);margin-top:1px;font-weight:400}
.chip .price{color:var(--tint);font-weight:600;font-variant-numeric:tabular-nums}

.optcards{display:flex;flex-direction:column;gap:.5rem}
.optcard{
  background:var(--bg-elevated);border:none;box-shadow:0 0 0 .5px var(--separator);border-radius:var(--r);
  padding:.8rem .95rem;cursor:pointer;transition:transform .15s var(--spring),background .15s ease;
  animation:cardSlideIn .32s var(--spring) both;
  position:relative;
}
.optcard::after{content:'';position:absolute;right:.9rem;top:50%;width:7px;height:7px;border-right:2px solid var(--label-3);border-top:2px solid var(--label-3);transform:translateY(-50%) rotate(45deg)}
/* Shared staggered entrance for every selectable option — area cards, chips, plan cards —
   so picking your way through the chat reads as one consistent, elegant rhythm. */
.optcard:nth-child(1),.chip:nth-child(1),.plancard:nth-child(1){animation-delay:0s}
.optcard:nth-child(2),.chip:nth-child(2),.plancard:nth-child(2){animation-delay:.07s}
.optcard:nth-child(3),.chip:nth-child(3),.plancard:nth-child(3){animation-delay:.14s}
.optcard:nth-child(4),.chip:nth-child(4),.plancard:nth-child(4){animation-delay:.21s}
.chip:nth-child(5){animation-delay:.28s}
@keyframes cardSlideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.optcard:hover{background:var(--bg-tertiary)}
.optcard:active{transform:scale(.985)}
.optcard:focus-visible,.plancard:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.optcard-title{font-size:.95rem;font-weight:600;color:var(--label);letter-spacing:-.01em;margin-bottom:.25rem;padding-right:1rem}
.optcard-desc{font-size:.8rem;color:var(--label-2);line-height:1.4;padding-right:1rem}

.note-block{
  background:var(--tint-wash);border:none;
  border-radius:var(--r);padding:.7rem .85rem;font-size:.8rem;color:var(--label-2);line-height:1.5;
}
.note-block b{color:var(--label);font-weight:600}
.note-block p{margin:0}
.note-block .note-link{display:block;margin-top:.55rem}

.stepper-card{
  background:var(--bg-elevated);border:none;box-shadow:0 0 0 .5px var(--separator);border-radius:var(--r);
  padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.stepper-name{font-size:.92rem;font-weight:500;color:var(--label)}
.stepper-desc{font-size:.74rem;color:var(--label-2);margin-top:1px}
.stepper-ctrl{display:flex;align-items:center;flex-shrink:0;background:var(--bg-tertiary);border-radius:9px;overflow:hidden}
.stp-btn{
  width:38px;height:34px;border-radius:0;border:none;
  background:transparent;color:var(--tint);font-size:1.15rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;font-weight:400;
}
.stp-btn:active{background:rgba(0,0,0,.06)}
.stp-btn:disabled{opacity:.35;cursor:not-allowed}
.stp-val{font-size:.92rem;font-weight:600;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;color:var(--label);border-left:.5px solid var(--separator);border-right:.5px solid var(--separator);height:34px;display:flex;align-items:center;justify-content:center}

.datefield-row{display:flex;gap:.6rem;flex-wrap:wrap}
.datefield{flex:1;min-width:140px;background:var(--bg-elevated);border:none;box-shadow:0 0 0 .5px var(--separator);border-radius:var(--r);padding:.65rem .85rem}
.datefield label{display:block;font-size:.72rem;font-weight:500;color:var(--label-2);margin-bottom:.3rem}
.datefield input{
  width:100%;background:transparent;border:none;color:var(--label);font-family:inherit;
  font-size:1rem;outline:none;padding:.15rem 0;min-height:1.5rem;font-variant-numeric:tabular-nums;
}
.datefield input::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer}
@media(prefers-color-scheme:dark){.datefield input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}}
.datefield select{
  width:100%;background:var(--bg-elevated);border:none;color:var(--label);font-family:inherit;
  font-size:1rem;outline:none;padding:.15rem 0;min-height:1.5rem;
}
.datefield select option{background:var(--bg-elevated);color:var(--label)}
.datefield textarea{
  width:100%;background:transparent;border:none;color:var(--label);font-family:inherit;
  font-size:1rem;outline:none;padding:.15rem 0;resize:none;min-height:2.6rem;
}

.send-row{display:flex;justify-content:flex-end}
.send-btn{
  width:34px;height:34px;border-radius:50%;background:var(--tint);border:none;color:#fff;
  font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--spring),opacity .15s ease;flex-shrink:0;
}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{background:var(--bg-tertiary);color:var(--label-3);cursor:not-allowed;transform:none}

/* ── Nominee (multi-beneficiary split) ── */
.nom-block{background:var(--bg-elevated);border:none;box-shadow:0 0 0 .5px var(--separator);border-radius:var(--r);padding:.75rem .85rem;margin-bottom:.55rem}
.nom-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.nom-block-title{font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--label-2)}
.nom-remove{background:none;border:none;color:var(--label-3);font-size:.95rem;cursor:pointer;line-height:1;padding:0 .2rem;font-family:inherit}
.nom-remove:hover{color:var(--destructive)}
.nom-alloc-line{font-size:.76rem;color:var(--label-2);padding:.1rem 0 .6rem}
.nom-alloc-line.warn{color:var(--warning)}
.btn-add-nominee{
  width:100%;background:transparent;border:1px dashed var(--separator);border-radius:var(--r);
  color:var(--tint);font-family:inherit;font-size:.85rem;font-weight:500;padding:.6rem;
  cursor:pointer;margin-bottom:.6rem;
}
.btn-add-nominee:hover{background:var(--tint-wash)}
.inline-toggle{background:none;border:none;color:var(--tint);font-family:inherit;font-size:.78rem;text-decoration:none;cursor:pointer;padding:0;margin:0 0 .6rem;display:block}
.inline-toggle:hover{opacity:.7}

/* ── Plan cards ── */
.plancards{display:flex;flex-direction:column;gap:.55rem}
.plancard{
  background:var(--bg-elevated);border:none;box-shadow:0 0 0 .5px var(--separator);border-radius:var(--r);
  padding:.85rem .95rem;cursor:pointer;transition:transform .15s var(--spring),box-shadow .15s ease;
  animation:cardSlideIn .32s var(--spring) both;
}
.plancard:hover{box-shadow:0 0 0 1px var(--separator)}
.plancard:active{transform:scale(.99)}
.plancard.sel{box-shadow:0 0 0 2px var(--tint)}
.plancard-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.55rem}
.plan-confirm{
  display:none;width:100%;margin-top:.75rem;padding:.65rem;border-radius:10px;
  border:none;color:#fff;background:var(--tint);
  font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;
}
.plancard.sel .plan-confirm{display:block}
.plan-confirm:active{opacity:.85}
.plancard .pname{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--label-2)}
.plancard.pop .pname{color:var(--tint)}
.plancard .pprice{font-weight:700;font-size:1.1rem;color:var(--label);flex-shrink:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.plan-reco-note{font-size:.78rem;color:var(--tint);line-height:1.4;margin:-.25rem 0 .55rem}
.plan-feats{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.32rem .6rem}
.plan-feats li{display:flex;align-items:flex-start;gap:.35rem;font-size:.78rem;color:var(--label-2);line-height:1.4}
.plan-feats .fy{color:var(--success);flex-shrink:0}
.plan-feats .fn{color:var(--label-3);flex-shrink:0}

/* ── Ticket (Wallet-pass style) ── */
.ticket{
  background:var(--bg-elevated);
  color:var(--label);border-radius:14px;
  position:relative;overflow:hidden;border-bottom-left-radius:5px;
  max-width:min(88%,400px);
  box-shadow:0 0 0 .5px var(--separator),0 12px 28px -14px rgba(0,0,0,.3);
}
.ticket::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--tint)}
.ticket-body{padding:1.05rem 1.15rem .95rem}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.7rem}
.ticket-eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--tint);display:flex;align-items:center;gap:.4rem}
.ticket-stamp{font-size:.62rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--success-deep);background:rgba(52,199,89,.12);border:none;box-shadow:0 0 0 1px rgba(52,199,89,.35);border-radius:6px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
.ticket-amount{font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ticket-currency{font-size:.9rem;font-weight:600;color:var(--label-2);margin-right:.2rem}
.ticket-amount-caption{font-size:.68rem;font-weight:500;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em;margin-top:.25rem}
.ticket-perf{position:relative;margin:.9rem -1.15rem;border-top:1px dashed var(--separator)}
.ticket-perf::before,.ticket-perf::after{content:'';position:absolute;top:50%;width:18px;height:18px;background:var(--bg);border-radius:50%;transform:translateY(-50%)}
.ticket-perf::before{left:-9px}
.ticket-perf::after{right:-9px}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem 1rem;margin-bottom:.95rem}
.ticket-grid .full{grid-column:1/-1}
.ticket-cell-label{font-size:.66rem;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--label-2);margin-bottom:.18rem}
.ticket-cell-value{font-size:.9rem;font-weight:600;color:var(--label);line-height:1.3}
.ticket-breakdown-label{font-size:.66rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--tint);margin-bottom:.3rem}
.ticket-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--label-2);padding:.32rem 0}
.ticket-row+.ticket-row{border-top:.5px dashed var(--separator)}
.ticket-row span:last-child{font-weight:600;color:var(--label);text-align:right;font-variant-numeric:tabular-nums}
.ticket-row-discount span:last-child{color:var(--success-deep)}
.ticket-row-total{border-top:.5px solid var(--separator)!important;margin-top:.1rem;padding-top:.5rem!important}
.ticket-row-total span{font-weight:700!important;font-size:.9rem}
.ticket-row-total span:first-child{color:var(--label)}
.ticket-barcode{
  height:24px;margin-top:.3rem;border-top:.5px dashed var(--separator);
  background:repeating-linear-gradient(90deg,var(--label) 0 2px,transparent 2px 5px,var(--label) 5px 6px,transparent 6px 8px,var(--label) 8px 11px,transparent 11px 15px,var(--label) 15px 16px,transparent 16px 20px);
  background-repeat:repeat-x;opacity:.55;
}

.footer-note{padding:1.2rem .9rem calc(2rem + env(safe-area-inset-bottom));text-align:center;font-size:.74rem;color:var(--label-3);flex-shrink:0}

// ═══════════ PRICING (verified against Explorer.pdf policy wording) ═══════════
const PREMIUMS = {
  '1': {
    adult:  { basic:[47,68,110,144,34,365],    essential:[58,84,135,179,44,455],    deluxe:[86,130,187,238,58,627]    },
    senior: { basic:[128,192,300,395,95,1031],  essential:[161,237,368,483,115,1264], deluxe:[185,277,412,531,127,1408] },
    family: { basic:[120,173,278,365,85,924],   essential:[149,216,343,455,111,1114], deluxe:[219,331,476,605,148,1550] }
  },
  '2': {
    adult:  { basic:[71,102,164,216,50,506],    essential:[83,123,198,265,66,650],    deluxe:[121,176,260,334,83,851]   },
    senior: { basic:[192,287,449,592,143,1432], essential:[237,353,548,721,173,1747], deluxe:[271,401,601,779,187,1920] },
    family: { basic:[178,258,415,546,128,1281], essential:[213,314,505,673,166,1525], deluxe:[308,449,660,847,209,2033] }
  },
  '3': {
    adult:  { basic:[175,253,408,538,126,1137],  essential:[215,310,496,705,164,1438],  deluxe:[324,466,671,899,212,2006]  },
    senior: { basic:[478,716,1121,1478,357,3218], essential:[583,871,1360,1792,432,3907], deluxe:[688,1021,1525,1972,477,4447] },
    family: { basic:[441,641,1033,1362,319,2875], essential:[502,754,1231,1651,415,3358], deluxe:[779,1149,1674,2140,536,4796] }
  },
  D: {
    adult:  [23,30,45,60,15,230],
    senior: [62,83,124,165,41,620],
    family: [57,76,114,152,38,570]
  }
};
function getBracket(table, days, annual) {
  if (annual) return table[5];
  if (days <= 5)  return table[0];
  if (days <= 10) return table[1];
  if (days <= 18) return table[2];
  if (days <= 31) return table[3];
  const extraWeeks = Math.ceil((days - 31) / 7);
  return table[3] + extraWeeks * table[4];
}
function applyTax(base, isDomestic) {
  const afterSST = isDomestic ? Math.round(base * 1.08 * 100) / 100 : base;
  const stampDuty = afterSST >= 150 ? 10 : 0;
  return Math.round((afterSST + stampDuty) * 100) / 100;
}
function applyGroupDiscount(base, policyType, adults) {
  if (policyType === 'family' || adults < 2) return base;
  return Math.round(base * 0.95 * 100) / 100;
}
function calcPremium(S) {
  const annual = S.tripType === 'annual';
  const days = annual ? 365 : S.days;
  const isDomestic = S.area === 'D';
  const out = { basic:0, essential:0, deluxe:0 };
  if (isDomestic) {
    let t;
    if (S.policyType === 'family') t = getBracket(PREMIUMS.D.family, days, annual);
    else t = getBracket(PREMIUMS.D.adult, days, annual) * S.adults + getBracket(PREMIUMS.D.senior, days, annual) * S.seniors;
    const base = applyGroupDiscount(Math.round(t * 100) / 100, S.policyType, S.adults);
    ['basic','essential','deluxe'].forEach(p => out[p] = applyTax(base, true));
  } else {
    const at = PREMIUMS[S.area];
    ['basic','essential','deluxe'].forEach(p => {
      let t;
      if (S.policyType === 'family') t = getBracket(at.family[p], days, annual);
      else t = getBracket(at.adult[p], days, annual) * S.adults + getBracket(at.senior[p], days, annual) * S.seniors;
      const base = applyGroupDiscount(Math.round(t * 100) / 100, S.policyType, S.adults);
      out[p] = applyTax(base, false);
    });
  }
  return out;
}
// Picks the best-fit tier for the trip in state — domestic has only one real plan, so it
// returns null there. International trips default to Essential (best everyday value) and
// step up to Deluxe when there's meaningfully more to protect or more cancellation risk.
function recommendPlan(S){
  if(S.area==='D')return null;
  if(S.area==='3')return{key:'deluxe',reason:"Area 3 trips carry the highest medical costs abroad — Deluxe's higher cover and CFAR fit best."};
  if(S.tripType==='annual')return{key:'deluxe',reason:"Annual cover benefits most from Deluxe's higher limits and CFAR."};
  if(S.tripType==='single'&&S.days>=14)return{key:'deluxe',reason:"Longer trips carry more exposure — Deluxe's higher cover and CFAR fit best."};
  return{key:'essential',reason:'Great everyday value — solid cover with lounge access included.'};
}
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function paxStr(S){
  const p=[];
  if(S.adults>0)p.push(S.adults+(S.adults>1?' adults':' adult'));
  if(S.seniors>0)p.push(S.seniors+(S.seniors>1?' seniors':' senior'));
  if(S.children>0)p.push(S.children+(S.children>1?' children':' child'));
  return p.join(', ');
}
// Full breakdown for the chosen plan; mirrors calcPremium's formula exactly, used for the quote submission payload.
function calcDetail(S, plan){
  const annual = S.tripType==='annual';
  const days = annual ? 365 : S.days;
  const isDomestic = S.area==='D';
  let rawBase;
  if (isDomestic){
    rawBase = S.policyType==='family'
      ? getBracket(PREMIUMS.D.family, days, annual)
      : getBracket(PREMIUMS.D.adult, days, annual) * S.adults + getBracket(PREMIUMS.D.senior, days, annual) * S.seniors;
  } else {
    const at = PREMIUMS[S.area];
    rawBase = S.policyType==='family'
      ? getBracket(at.family[plan], days, annual)
      : getBracket(at.adult[plan], days, annual) * S.adults + getBracket(at.senior[plan], days, annual) * S.seniors;
  }
  rawBase = Math.round(rawBase*100)/100;
  const groupEligible = S.policyType!=='family' && S.adults>=2;
  const base = groupEligible ? Math.round(rawBase*0.95*100)/100 : rawBase;
  const discountAmt = Math.round((rawBase-base)*100)/100;
  const afterSST = isDomestic ? Math.round(base*1.08*100)/100 : base;
  const sstAmt = isDomestic ? Math.round((afterSST-base)*100)/100 : 0;
  const stampAmt = afterSST>=150 ? 10 : 0;
  const total = Math.round((afterSST+stampAmt)*100)/100;
  return { base, rawBase, discountAmt, sstAmt, stampAmt, total };
}
// NRIC helpers; same logic as the live site.
function fmtNRICStr(v){
  let d=v.replace(/\D/g,'').slice(0,12);
  if(d.length>6)d=d.slice(0,6)+'-'+d.slice(6);
  if(d.length>9)d=d.slice(0,9)+'-'+d.slice(9);
  return d;
}
function parseNRICInfo(nric){
  const raw=nric.replace(/\D/g,'');
  if(raw.length<12) return null;
  const yy=raw.slice(0,2),mm=raw.slice(2,4),dd=raw.slice(4,6);
  const yr=(parseInt(yy)<=parseInt(new Date().getFullYear().toString().slice(2))?'20':'19')+yy;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mi=parseInt(mm)-1;
  if(mi<0||mi>11) return null;
  return {
    dob:`${dd} ${months[mi]} ${yr}`, gender: parseInt(raw[11])%2===1?'Male':'Female',
    year:parseInt(yr), month:parseInt(mm), day:parseInt(dd)
  };
}
// Eligibility cross-check: catches a traveller counted as the wrong age band (e.g. a senior counted as an adult).
// Takes numeric year/month/day directly rather than re-parsing a formatted display string like "31 Dec 1990",
// which parses inconsistently across browsers (this is exactly the kind of thing that broke silently on iOS before).
function ageFromParts(year, month, day){
  if (!year || !month || !day) return null;
  const today=new Date();
  let age=today.getFullYear()-year;
  const beforeBirthdayThisYear = (today.getMonth()+1<month) || (today.getMonth()+1===month && today.getDate()<day);
  if (beforeBirthdayThisYear) age--;
  return age;
}
function eligibilityIssue(ageBand, age, policyType){

  }

  return null;
}
async function checkEligibilityThen(age, nextFn){

// ═══════════ CONVERSATION ENGINE ═══════════
const S = { tripType:'single', policyType:'individual', adults:1, seniors:0, children:0, area:'', dateFrom:'', dateTo:'', days:0, annualStart:'', annualEnd:'', plan:'' };
const thread = document.getElementById('thread');

function scrollDown(){ thread.scrollTo({top:thread.scrollHeight, behavior:'smooth'}); }
// Lets a keyboard user activate a card-style choice the same way a click does.
function onOptKey(e){

let suppressAsk=false;
function sleep(ms){ return suppressAsk ? Promise.resolve() : new Promise(resolve=>setTimeout(resolve, ms)); }
// Typing delay scales with how much there is to "type", instead of one fixed
// duration for every message regardless of length. Floored so short messages
// still read as a deliberate pause rather than a flicker, and capped so a
// long passage (e.g. the declaration) doesn't drag on.
function typingDelayFor(html){
  const text=html.replace(/<[^>]*>/g,'');

}
function sayTheirs(html, delay){
  if (suppressAsk) return Promise.resolve();

let widgetCounter=0;
function showTextWidget(opts){

    ? `<textarea id="${id}" placeholder="${opts.placeholder||''}"></textarea>`

const AREA_LABELS = { D:'Domestic', '1':'Area 1: Asia-Pacific', '2':'Area 2: Worldwide excl. USA/Canada', '3':'Area 3: Worldwide' };

// ═══════════ PROGRESS (Trip / Plan / Details / Pay) ═══════════
// Mirrors the wizard's 4-step track. Set from the first function of each phase, so Back/jump

function setProgress(phase){

    const seg=document.getElementById('pseg-'+i);

// ═══════════ STEP HISTORY (Back / Start over) ═══════════
let history=[];
function snapshotState(){
  const {paymentSlip, ...rest} = S;
  return {
    S: JSON.parse(JSON.stringify(rest)),
    travellerData: JSON.parse(JSON.stringify(travellerData)),
    travellers: JSON.parse(JSON.stringify(travellers)),
    curT

}
function restoreState(snap){
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, snap.S);

  travellers = snap.travellers;
  curT = snap.curT;
}
// The only way any step should move to the next one: records where we are now, then runs it.
let currentCp=null;
function enterStep(fn){
  const threadLen=thread.children.length;
  const cp={ threadLen, askedLen:threadLen, snap: snapshotState(), fn };
  history.push(cp);
  currentCp=cp;
  fn();
}
// Jump directly to an earlier checkpoint and fully replay it, question bubble included (used by Back).
function jumpTo(idx){
  if (idx<0 || idx>=history.length) return;
  const cp=history[idx];
  history=history.slice(0, idx+1);
  restoreState(cp.snap);
  while (thread.children.length > cp.threadLen) thread.lastElementChild.remove();
  currentCp=cp;
  cp.fn();
}
// Jump to an earlier checkpoint but keep its question bubble in place, only refreshing the widget
// (used by the per-answer edit pencils, so fixing an earlier answer doesn't re-ask the question).
function editJumpTo(idx){
  if (idx<0 || idx>=history.length) return;
  const cp=history[idx];
  history=history.slice(0, idx+1);
  restoreState(cp.snap);

// ═══════════ TRAVELLER DETAILS ═══════════
let travellers=[], travellerData=[], curT=0;
function buildTravellerList(){
  travellers=[];
  for(let i=0;i<S.adults;i++) travellers.push({ageBand:'Adult', label:i===0?'you':`Adult ${i+1}`});
  for(let i=0;i<S.seniors;i++) travellers.push({ageBand:'Senior', label:`Senior ${i+1}`});
  for(let i=0;i<S.children;i++) travellers.push({ageBand:'Child', label:`Child ${i+1}`});
}

// Single card per traveller: name (+ mobile, first traveller only) + ID, defaulting to NRIC
// with a plain-text toggle to passport (which reveals nationality/gender/DOB inline), plus a
// collapsed "+ Add beneficiary" nominee section. One submit instead of up to 4 separate asks.
let cardDraft=null;
async function askTravellerCard(){
  setProgress(3);
  const t=travellers[curT];
  const existing=travellerData[curT];
  cardDraft = {
    fullName: existing?.fullName || '',
    mobile: S.mobile || '',
    idType: existing?.idType || 'nric',
    idNumber: existing?.idNumber || '',
    nationality: existing?.idType==='passport' ? (existing.nationality||'') : '',
    gender: existing?.idType==='passport' ? (existing.gender||'') : '',
    dobRaw: existing?.idType==='passport' ? (existing.dobRaw||'') : ''
  };
  nomBlocks = (existing?.nominees && existing.nominees.length)
    ? existing.nominees.map(n=>({nid:++nomNid, name:n.name, idNumber:n.idNumber, relationship:n.relationship, share:n.share}))
    : [];
  await sayTheirs(curT===0 ? 'Your name, mobile number, and ID:' : `${t.label}'s name and ID:`);
  renderTravellerCard();
}
// Field shape for whichever idType is active — NRIC only takes 12 digits, passport only takes
// alphanumeric, so each rejects the other's format outright (no more guessing which was typed).
function idFieldMeta(type){
  return type==='passport'
    ? { label:'Passport', fieldLabel:'Passport Number', placeholder:'e.g. A12345678', maxlength:20,
        format:v=>v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20),
        validate:v=>v.replace(/[^A-Za-z0-9]/g,'').length>=5 }
    : { label:'NRIC', fieldLabel:'NRIC', placeholder:'000000-00-0000', maxlength:14,
        format:fmtNRICStr,
        validate:v=>v.replace(/\D/g,'').length===12 };
}
function renderTravellerCard(){
  const meta=idFieldMeta(cardDraft.idType);
  const mobileField = curT===0 ? `<div class="datefield" style="margin-bottom:.55rem"><label>Mobile Number</label><input type="tel" id="cardMobile" placeholder="012 345 6789" value="${cardDraft.mobile}"></div>` : '';
  const passportFields = cardDraft.idType==='passport' ? `
    <div class="datefield" style="margin-bottom:.55rem"><label>Nationality</label><input type="text" id="cardNationality" placeholder="e.g. Singaporean" value="${cardDraft.nationality}"></div>
    <div class="datefield" style="margin-bottom:.55rem"><label>Gender</label>
      <select id="cardGender">
        <option value="">Select…</option>
        <option>Male</option><option>Female</option>
      </select>
    </div>
    <div class="datefield" style="margin-bottom:.55rem"><label>Date of Birth</label><input type="date" id="cardDob" max="${todayStr}" value="${cardDraft.dobRaw}"></div>` : '';
  const nomineeSection = nomBlocks.length ? `
    <div id="nomBlocksWrap">${nomBlocks.map((b,i)=>nomBlockHtml(b,i)).join('')}</div>
    <button type="button" class="btn-add-nominee" onclick="addNomBlock()">+ Add another beneficiary</button>
    <div class="nom-alloc-line" id="nomAllocLine"></div>` :
    `<button type="button" class="btn-add-nominee" onclick="openCardNominee()">+ Add beneficiary (optional)</button>`;

  clearWidget();
  showWidget(`
    <div class="datefield" style="margin-bottom:.55rem"><label>Full Name</label><input type="text" id="cardName" placeholder="As per NRIC / Passport" value="${cardDraft.fullName}"></div>
    ${mobileField}
    <div class="datefield" style="margin-bottom:.3rem"><label>${meta.fieldLabel}</label><input type="text" id="cardId" placeholder="${meta.placeholder}" maxlength="${meta.maxlength}" value="${cardDraft.idNumber}"></div>
    <button type="button" class="inline-toggle" onclick="toggleCardIdType()">${cardDraft.idType==='nric' ? 'Foreign passport instead?' : 'Use NRIC instead'}</button>
    ${passportFields}
    ${nomineeSection}
    <div class="send-row"><button class="send-btn" id="cardSend" disabled onclick="confirmTravellerCard()">→</button></div>`);

  document.getElementById('cardName').addEventListener('input', e=>{ cardDraft.fullName=e.target.value; checkCardValid(); });
  if (curT===0) document.getElementById('cardMobile').addEventListener('input', e=>{ cardDraft.mobile=e.target.value; checkCardValid(); });
  document.getElementById('cardId').addEventListener('input', e=>{ e.target.value=meta.format(e.target.value); cardDraft.idNumber=e.target.value; checkCardValid(); });
  if (cardDraft.idType==='passport'){
    document.getElementById('cardNationality').addEventListener('input', e=>{ cardDraft.nationality=e.target.value; checkCardValid(); });
    document.getElementById('cardGender').addEventListener('change', e=>{ cardDraft.gender=e.target.value; checkCardValid(); });
    document.getElementById('cardDob').addEventListener('input', e=>{ cardDraft.dobRaw=e.target.value; checkCardValid(); });
    if (cardDraft.gender) document.getElementById('cardGender').value=cardDraft.gender;
  }
  nomBlocks.forEach(b=>{
    document.getElementById(`nomName-${b.nid}`).addEventListener('input', e=>{ b.name=e.target.value; checkCardValid(); });
    document.getElementById(`nomNric-${b.nid}`).addEventListener('input', e=>{ e.target.value=fmtNRICStr(e.target.value); b.idNumber=e.target.value; checkCardValid(); });
    document.getElementById(`nomRel-${b.nid}`).addEventListener('change', e=>{ b.relationship=e.target.value; checkCardValid(); });
    document.getElementById(`nomShare-${b.nid}`).addEventListener('input', e=>{ b.share=parseFloat(e.target.value)||0; checkCardValid(); });
    if (b.relationship) document.getElementById(`nomRel-${b.nid}`).value=b.relationship;
  });
  checkCardValid();
}
function toggleCardIdType(){
  cardDraft.idType = cardDraft.idType==='nric' ? 'passport' : 'nric';
  cardDraft.idNumber=''; cardDraft.nationality=''; cardDraft.gender=''; cardDraft.dobRaw='';
  renderTravellerCard();
}
function openCardNominee(){
  nomBlocks=[{nid:++nomNid, name:'', idNumber:'', relationship:'', share:100}];
  renderTravellerCard();
}
function checkCardValid(){
  const meta=idFieldMeta(cardDraft.idType);
  const nameOk = cardDraft.fullName.trim().length>0;
  const mobileOk = curT!==0 || cardDraft.mobile.trim().length>0;
  const idOk = meta.validate(cardDraft.idNumber);
  const passportOk = cardDraft.idType!=='passport' || (cardDraft.nationality.trim() && cardDraft.gender && cardDraft.dobRaw);
  let nomineeOk=true;
  if (nomBlocks.length){
    const total=Math.round(nomBlocks.reduce((s,b)=>s+(parseFloat(b.share)||0),0)*10)/10;
    const complete=nomBlocks.every(b=>b.name?.trim() && (b.idNumber||'').replace(/\D/g,'').length===12 && b.relationship && b.share>0);
    nomineeOk = complete && total===100;
    const line=document.getElementById('nomAllocLine');
    if (line){
      line.textContent = total===100 ? `${total}% allocated` : total>100 ? `⚠ ${total}% allocated — exceeds 100% by ${(total-100).toFixed(1)}%` : `${total}% allocated — ${(100-total).toFixed(1)}% remaining`;
      line.className = 'nom-alloc-line'+(total!==100?' warn':'');
    }
  }
  document.getElementById('cardSend').disabled = !(nameOk && mobileOk && idOk && passportOk && nomineeOk);
}
function confirmTravellerCard(){
  travellerData[curT] = travellerData[curT] || {};
  const t=travellerData[curT];
  t.ageBand = travellers[curT].ageBand;
  t.fullName = cardDraft.fullName.trim();
  t.idType = cardDraft.idType;
  t.idNumber = cardDraft.idNumber.trim();
  if (curT===0) S.mobile = cardDraft.mobile.trim();
  let age=null;
  if (cardDraft.idType==='passport'){
    t.nationality=cardDraft.nationality.trim();
    t.gender=cardDraft.gender;
    t.dobRaw=cardDraft.dobRaw;
    const [yr,mo,da]=cardDraft.dobRaw.split('-').map(Number);
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    t.dateOfBirth=`${da} ${months[mo-1]} ${yr}`;
    age=ageFromParts(yr,mo,da);
  } else {
    const info=parseNRICInfo(t.idNumber);
    t.nationality='MY';
    t.dateOfBirth=info?info.dob:'';
    t.gender=info?info.gender:'';
    age=info?ageFromParts(info.year,info.month,info.day):null;
  }
  if (nomBlocks.length) t.nominees = nomBlocks.map(b=>({name:b.name.trim(), idNumber:b.idNumber.trim(), relationship:b.relationship, share:b.share}));
  else delete t.nominees;

  clearWidget();
  const summary=[t.fullName];
  if (curT===0) summary.push(S.mobile);
  summary.push(t.idNumber);
  if (cardDraft.idType==='passport') summary.push(`${t.nationality} · ${t.gender} · ${t.dateOfBirth}`);
  if (t.nominees) summary.push(t.nominees.map(n=>`${n.name} (${n.relationship}) — ${n.share}%`).join(', '));
  sayMine(summary.join('<br>'), history.length-1);
  checkEligibilityThen(age, curT===0 ? ()=>enterStep(askAddressEmailOccupation) : nextTravellerOrContinue);
}

// Nominee blocks for the traveller currently being asked. Single nominee defaults to 100%;

let nomBlocks=[], nomNid=0;
function nomBlockHtml(b, idx){
  return `
    <div class="nom-block">
      <div class="nom-block-head">
        <span class="nom-block-title">Beneficiary ${idx+1}</span>
        ${nomBlocks.length>1 ? `<button type="button" class="nom-remove" onclick="removeNomBlock(${b.nid})">✕</button>` : ''}
      </div>
      <div class="datefield" style="margin-bottom:.5rem"><label>Full Name</label><input type="text" id="nomName-${b.nid}" placeholder="Full name" value="${b.name||''}"></div>
      <div class="datefield" style="margin-bottom:.5rem"><label>NRIC</label><input type="text" id="nomNric-${b.nid}" placeholder="000000-00-0000" maxlength="14" value="${b.idNumber||''}"></div>
      <div class="datefield" style="margin-bottom:.5rem"><label>Relationship</label>
        <select id="nomRel-${b.nid}">
          <option value="">Select…</option>
          <option>Spouse</option><option>Parent</option><option>Child</option><option>Sibling</option><option>Other</option>
        </select>
      </div>
      <div class="datefield"><label>Allocation %</label><input type="number" id="nomShare-${b.nid}" min="1" max="100" value="${b.share}"></div>
    </div>`;
}
// Evenly re-splits 100% across all current blocks, front-loading the remainder
// (3 blocks -> 34/33/33, not 33/33/33=99) — called on add/remove only, never on a manual edit.
function redistributeNomShares(){
  const n=nomBlocks.length;
  const base=Math.floor(100/n), rem=100-base*n;
  nomBlocks.forEach((b,i)=>{ b.share = base + (i<rem?1:0); });
}
function addNomBlock(){
  nomBlocks.push({nid:++nomNid, name:'', idNumber:'', relationship:'', share:0});
  redistributeNomShares();
  renderTravellerCard();
}
function removeNomBlock(nid){
  nomBlocks = nomBlocks.filter(b=>b.nid!==nid);
  if (nomBlocks.length) redistributeNomShares();
  renderTravellerCard();
}

// ═══════════ OPTIONAL EXTRAS ═══════════
async function askFlightOptional(){
  await sayTheirs('Want to add your flight details? Optional.');
  showWidget(`<div class="chiprow"><button class="chip" onclick="flightYes()">Add flight</button><button class="chip" onclick="skipStep('flight')">Skip</button></div>`);
}
async function flightYes(){
  clearWidget(); sayMine('Add flight', history.length-1);
  await sayTheirs('Flight number, and departure date?');
  showWidget(`
    <div class="textfield-row" style="margin-bottom:.55rem"><input type="text" id="wFlightNum" placeholder="Flight number"></div>
    <div class="datefield-row"><div class="datefield"><label>Departure</label><input type="date" id="wFlightDate" onchange="onFlightInput()"></div></div>
    <div class="send-row"><button class="send-btn" id="flightSend" disabled onclick="confirmFlight()">→</button></div>`);
  document.getElementById('wFlightNum').addEventListener('input', onFlightInput);
}
function onFlightInput(){ document.getElementById('flightSend').disabled = !document.getElementById('wFlightDate').value; }
async function confirmFlight(){
  const num=document.getElementById('wFlightNum').value.trim();
  const date=document.getElementById('wFlightDate').value;
  S.flight={departureFlightNumber:num, departureDate:fmtDate(date)};
  clearWidget(); sayMine(`${num||'Flight'} · ${fmtDate(date)}`, history.length-1);
  enterStep(askPaymentMethod);
}
function skipStep(which){
  clearWidget(); sayMine('Skip', history.length-1);
  if (which==='flight') enterStep(askPaymentMethod);
}

// ═══════════ PAYMENT ═══════════
async function askPaymentMethod(){
  setProgress(4);
  await sayTheirs('How would you like to pay?');
  showWidget(`<div class="chiprow">
    <button class="chip" onclick="pickPayment('duitnow')">DuitNow QR</button>
    <button class="chip" onclick="pickPayment('tng')">Touch 'n Go</button>
    <button class="chip" onclick="pickPayment('bank')">Bank Transfer</button>
  </div>`);
}
async function pickPayment(method){
  S.payMethod=method; clearWidget();
  const labels={duitnow:'DuitNow QR', tng:"Touch 'n Go", bank:'Bank Transfer'};
  sayMine(labels[method], history.length-1);
  const insts={
    duitnow:'Scan this QR code with your banking app, then upload your receipt below.<br><img src="/duitnow-qr.png" style="max-width:200px;border-radius:12px;margin-top:.5rem" alt="DuitNow QR">',
    tng:"Transfer to <strong>012 612 3540</strong> (Lee Mou Yen) via Touch 'n Go, then upload your receipt below.",
    bank:'Transfer to <strong>1040 2700 307120</strong> (RHB Bank, Lee Mou Yen), then upload your receipt below.'
  };
  await sayTheirs(insts[method]);
  enterStep(askUploadSlip);
}
async function askUploadSlip(){
  showWidget(`
    <div class="upload-zone" onclick="document.getElementById('wFile').click()">
      <div class="upload-icon">📎</div>
      <div class="upload-text" id="uploadLabel">Tap to upload your payment receipt</div>
      <div class="upload-hint">JPG, PNG or PDF · Max 5MB</div>
    </div>
    <input type="file" id="wFile" accept="image/*,.pdf" style="display:none" onchange="onFileChosen()">
    <div class="send-row"><button class="send-btn" id="fileSend" disabled onclick="confirmSlip()">→</button></div>`);
}
function onFileChosen(){
  const f=document.getElementById('wFile').files[0];
  document.getElementById('uploadLabel').textContent = f ? f.name : 'Tap to upload your payment receipt';
  document.getElementById('fileSend').disabled = !f;
}
async function confirmSlip(){
  const f=document.getElementById('wFile').files[0];
  S.paymentSlip=f;
  clearWidget(); sayMine(`Uploaded: ${f.name}`, history.length-1);
  enterStep(askDeclaration);
}

// ═══════════ DECLARATION & SUBMIT ═══════════
async function askDeclaration(){
  await sayTheirs(`Almost done, please confirm:<br><br><strong>Application:</strong> Details are accurate. Cover only begins once payment is received. Henry Lee is my appointed advisor.<br><br><strong>Health:</strong> No Insured Person has, in the past 6 months, been hospitalised, given a terminal prognosis, or diagnosed with any mental illness. Pre-existing conditions aren't covered.<br><br><strong>Data (PDPA):</strong> I consent to my personal data being shared with Tokio Marine and related parties to arrange this policy.`);
  showWidget(`
    <div class="chiprow"><button class="chip" id="agreeBtn" onclick="agreeAndSubmit()" style="border-color:var(--wa);color:var(--wa)" disabled>I agree, submit application</button></div>
    <div id="turnstileBox" style="margin-top:.6rem"></div>`);
  renderChatTurnstile();
}
function retryDeclaration(){
  const idx=findCheckpointIdx(askDeclaration);
  if (idx>=0) editJumpTo(idx); else askDeclaration();
}

// ═══════════ TURNSTILE (bot protection on submit) ═══════════
const TURNSTILE_SITEKEY='0x4AAAAAAExNY-ahjB2s2iFX';
let chatTurnstileToken='';
function renderChatTurnstile(){
  if(!window.turnstile){ setTimeout(renderChatTurnstile,200); return; }
  chatTurnstileToken='';
  turnstile.render('#turnstileBox',{
    sitekey:TURNSTILE_SITEKEY,
    action:'submit_application',
    theme:'dark',
    callback:(token)=>{ chatTurnstileToken=token; const btn=document.getElementById('agreeBtn'); if(btn)btn.disabled=false; },
    'expired-callback':()=>{ chatTurnstileToken=''; const btn=document.getElementById('agreeBtn'); if(btn)btn.disabled=true; }
  });
}
function buildPayload(){
  const proposerName = travellerData[0]?.fullName || '';
  const travellersOut = travellerData.map((t,i)=>({
    fullName:t.fullName, idNumber:t.idNumber||'', nationality:t.nationality||'MY',
    dateOfBirth:t.dateOfBirth||'', gender:(t.gender||'').toLowerCase(), ageBand:t.ageBand,
    occupation: i===0 ? S.occupation : '',
    address: i===0 ? S.address : ''
  }));
  const d=S.detail;
  const items=[{ label:`${S.plan.charAt(0).toUpperCase()+S.plan.slice(1)} Plan · ${paxStr(S)}`, value:d.rawBase }];
  if (d.discountAmt>0) items.push({label:'5% Group Discount', value:-d.discountAmt});
  if (d.sstAmt>0) items.push({label:'8% Service Tax', value:d.sstAmt});
  items.push({label:'Stamp Duty', value:d.stampAmt});

  return {
    source:'chat',
    proposer:{ name:proposerName, mobile:S.mobile, email:S.email, occupation:S.occupation, address:S.address, sameAsFirstTraveller: true },
    product:{
      insuranceType:S.tripType, policyType:S.policyType,
      coverageArea:{D:'domestic','1':'area1','2':'area2','3':'area3'}[S.area],
      departureDate: S.tripType==='annual' ? fmtDate(S.annualStart) : fmtDate(S.dateFrom),
      returnDate: S.tripType==='annual' ? fmtDate(S.annualEnd) : fmtDate(S.dateTo),
      selectedPlan:S.plan
    },
    quote:{ total:d.total, items },
    paymentMethod:S.payMethod,
    insuredTravellers:travellersOut,
    nominees: travellerData.flatMap((t,i)=>(t.nominees||[]).map(n=>({travellerIndex:i, name:n.name, idNumber:n.idNumber||'', relationship:n.relationship, share:n.share}))),
    flights: S.flight ? [S.flight] : []
  };
}
async function agreeAndSubmit(){
  if(!chatTurnstileToken) return;
  clearWidget(); sayMine('I agree, submit application');
  await sayTheirs('Submitting…');
  const payload=buildPayload();
  const fd=new FormData();
  fd.append('submission', JSON.stringify(payload));
  fd.append('cf-turnstile-response', chatTurnstileToken);
  if (S.paymentSlip) fd.append('paymentSlip', S.paymentSlip);
  try{
    const res=await fetch('/api/submit', {method:'POST', body:fd});
    const data=await res.json();
    if (!res.ok){
      await sayTheirs(`Something went wrong: ${data.error || 'please try again.'}`);
      showWidget(`<div class="chiprow"><button class="chip" onclick="retryDeclaration()">Try again</button></div>`);
      return;
    }
    showSuccess();
  }catch(e){
    await sayTheirs('Network error, please check your connection and try again, or WhatsApp me directly.');
    showWidget(`<div class="chiprow"><button class="chip" onclick="retryDeclaration()">Try again</button></div>`);
  }
}
async function showSuccess(){
  setProgress(5);
  await sayTheirs("All submitted! I'll review this and follow up shortly. Your cover note will be sent once your payment is received and confirmed, usually within 2 working hours. Cover only begins once payment is received, so please avoid non-refundable bookings until you've received it.");
  await sayTheirs("Keep these for a smooth claim: original receipts, medical reports/certificates, boarding passes, and any police or authority reports.");
  await sayTheirs("And if anything happens overseas, call our 24-Hour Travel Assistance on <strong>+603 7628 3877</strong> before hospital admission or evacuation, so it's arranged cashless. General Customer Service: 1800 88 0812.");
  await sayTheirs("One last thing, mind rating this chat experience?");
  showRatingWidget();
}

let selectedRating=0;
function showRatingWidget(){
  showWidget(`
    <div class="rating-row" id="starRow">
      ${[1,2,3,4,5].map(n=>`<button class="star-btn" data-n="${n}" onclick="setRating(${n})" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}
    </div>
    <div class="widget-hint">Optional &middot; sends via WhatsApp so Henry can read it</div>
    <div class="textfield-row">
      <textarea id="wFeedback" placeholder="Anything you'd like to share? (optional)"></textarea>
    </div>
    <div class="send-row"><button class="send-btn" onclick="sendFeedback()">→</button></div>`);
}
function setRating(n){
  selectedRating=n;
  document.querySelectorAll('#starRow .star-btn').forEach(b=>{
    b.classList.toggle('on', Number(b.dataset.n)<=n);
  });
}
function sendFeedback(){
  const text=document.getElementById('wFeedback').value.trim();
  clearWidget();
  const summary = selectedRating ? `${'★'.repeat(selectedRating)}${text?' · '+text:''}` : (text || 'Skipped');
  sayMine(summary);
  sayTheirs('Thanks, this really helps me improve things for future clients!');
  if (selectedRating || text){
    const msg=`Feedback on the chat quote tool${selectedRating?` (rating: ${selectedRating}/5)`:''}${text?': '+text:''}`;
    window.open(`https://wa.me/60126123540?text=${encodeURIComponent(msg)}`, '_blank');
  }
}

start();
</script>
