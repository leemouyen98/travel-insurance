<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141b16">
<title>Get a Quote | Henry Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#141b16; --ink-2:#1d2a20; --ink-3:#26362a;
  --paper:#f0ead9; --text:#eef1e7; --text-soft:#a7b3a0; --text-faint:#798674;
  --brass:#cb9a44; --brass-deep:#8a6420;
  --wa:#3ab06c; --wa-deep:#1c7a45;
  --line:rgba(238,241,231,.10);
  --r:16px;
}
html{font-size:16px}
body{
  background:
    radial-gradient(ellipse 60% 30% at 20% 0%, rgba(203,154,68,.08) 0%, transparent 60%),
    var(--ink);
  color:var(--text); font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.chat-head{
  display:flex;align-items:center;gap:.6rem;padding:1rem 1.1rem;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:10;
}
.back-btn{
  background:none;border:none;color:var(--text-soft);font-size:1.5rem;line-height:1;
  cursor:pointer;padding:0 .25rem 0 0;flex-shrink:0;font-family:inherit;
}
.back-btn:hover{color:var(--brass)}
.reset-btn{
  margin-left:auto;background:none;border:none;color:var(--text-faint);font-size:.72rem;
  cursor:pointer;font-family:inherit;text-decoration:underline;flex-shrink:0;white-space:nowrap;
}
.reset-btn:hover{color:var(--text-soft)}
.avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(155deg,var(--brass),var(--brass-deep));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-weight:700;font-size:.75rem;color:var(--ink);
  object-fit:cover;border:1.5px solid var(--brass);
}
.chat-head-name{font-weight:700;font-size:.95rem}
.chat-head-sub{font-size:.72rem;color:var(--text-faint);margin-top:1px}
.chat-head-sub .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wa);margin-right:5px;vertical-align:middle}

/* ── Thread ── */
.thread{flex:1;padding:1.1rem .9rem 1.5rem;display:flex;flex-direction:column;gap:.55rem}
.row{display:flex;animation:in .28s ease}
.row.mine{justify-content:flex-end}
.row.theirs{justify-content:flex-start}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble{max-width:82%;padding:.62rem .85rem;font-size:.9rem;line-height:1.5;border-radius:17px}
.row.theirs .bubble{background:var(--paper);color:var(--ink);border-bottom-left-radius:4px}
.row.mine .bubble{background:var(--brass);color:var(--ink);border-bottom-right-radius:4px;font-weight:500}
.tag{display:inline-block;margin-top:.35rem;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brass-deep);background:rgba(20,27,22,.08);padding:2px 7px;border-radius:5px}

.typing{display:flex;gap:3px;align-items:center;background:var(--paper);padding:.6rem .8rem;border-radius:17px;border-bottom-left-radius:4px;width:fit-content}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.5;animation:bounce 1.1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:.9}}
@media(prefers-reduced-motion:reduce){.typing span{animation:none;opacity:.7}.row{animation:none}}

/* ── Widgets ── */
.widget{padding:.15rem .1rem .2rem;display:flex;flex-direction:column;gap:.6rem}
.chiprow{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{
  font-family:'Figtree',sans-serif;font-size:.85rem;font-weight:500;padding:.5rem .95rem;
  border-radius:20px;border:1.5px solid rgba(238,241,231,.18);color:var(--text);
  background:var(--ink-2);cursor:pointer;transition:all .15s ease;
}
.chip:hover{border-color:var(--brass)}
.chip .sub{display:block;font-size:.68rem;color:var(--text-faint);margin-top:1px;font-weight:400}
.chip .price{font-family:'Space Mono',monospace;color:var(--brass);font-weight:700}

.stepper-card{
  background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);
  padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.stepper-name{font-size:.85rem;font-weight:600;color:var(--text)}
.stepper-desc{font-size:.7rem;color:var(--text-faint);margin-top:1px}
.stepper-ctrl{display:flex;align-items:center;gap:.65rem;flex-shrink:0}
.stp-btn{
  width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(238,241,231,.2);
  background:transparent;color:var(--text-soft);font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;
}
.stp-btn:disabled{opacity:.3;cursor:not-allowed}
.stp-val{font-size:.95rem;font-weight:700;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}

.datefield-row{display:flex;gap:.6rem;flex-wrap:wrap}
.datefield{flex:1;min-width:140px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .85rem}
.datefield label{display:block;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.35rem}
.datefield input{
  width:100%;background:transparent;border:none;color:var(--text);font-family:inherit;
  font-size:.9rem;outline:none;-webkit-appearance:none;
}
.datefield input::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}

.send-row{display:flex;justify-content:flex-end}
.send-btn{
  width:42px;height:42px;border-radius:50%;background:var(--wa-deep);border:none;color:var(--text);
  font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease;flex-shrink:0;
}
.send-btn:hover{transform:scale(1.06)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* ── Plan cards ── */
.plancards{display:flex;flex-direction:column;gap:.55rem}
.plancard{
  background:var(--ink-2);border:1.5px solid var(--line);border-radius:var(--r);
  padding:.8rem .95rem;cursor:pointer;transition:all .15s ease;
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;
}
.plancard:hover{border-color:var(--brass)}
.plancard .pname{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
.plancard.pop .pname{color:var(--brass)}
.plancard .pfeat{font-size:.72rem;color:var(--text-soft);margin-top:.25rem}
.plancard .pprice{font-family:'Space Mono',monospace;font-weight:700;font-size:1.05rem;color:var(--text);flex-shrink:0}

/* ── Ticket ── */
.ticket{
  background:var(--paper);color:var(--ink);border-radius:14px;
  padding:.9rem 1rem 1rem;position:relative;overflow:hidden;border-bottom-left-radius:4px;
  max-width:82%;
}
.ticket::before{content:'';position:absolute;left:-6px;top:50%;width:12px;height:12px;background:var(--ink);border-radius:50%;transform:translateY(-50%)}
.ticket-eyebrow{font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;color:var(--brass-deep);margin-bottom:.35rem}
.ticket-amount{font-family:'Playfair Display',serif;font-weight:700;font-size:1.9rem;margin-bottom:.55rem;font-variant-numeric:tabular-nums}
.ticket-row{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:.68rem;padding:.28rem 0;border-top:1px dashed rgba(20,27,22,.18)}
.ticket-row span:first-child{color:var(--text-faint);letter-spacing:.03em}
.ticket-row span:last-child{font-weight:700;text-align:right}

.footer-note{padding:1.2rem .9rem 2rem;text-align:center;font-size:.7rem;color:var(--text-faint)}

/* ── Text widget ── */
.widget-hint{font-size:.72rem;color:var(--text-faint);margin-bottom:-.15rem}
.textfield-row{display:flex;gap:.55rem;align-items:center}
.textfield-row input,.textfield-row textarea{
  flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);
  padding:.7rem .9rem;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;
}
.textfield-row input:focus,.textfield-row textarea:focus{border-color:var(--brass)}
.textfield-row textarea{resize:none;min-height:2.6rem}

/* ── Upload ── */
.upload-zone{
  border:1.5px dashed rgba(238,241,231,.22);border-radius:var(--r);padding:1.1rem;
  text-align:center;cursor:pointer;transition:border-color .15s ease;
}
.upload-zone:hover{border-color:var(--brass)}
.upload-icon{font-size:1.2rem;margin-bottom:.3rem}
.upload-text{font-size:.82rem;color:var(--text-soft)}
.upload-hint{font-size:.68rem;color:var(--text-faint);margin-top:.2rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="chat-head">
    <button class="back-btn" onclick="goBack()" aria-label="Back" title="Back">‹</button>
    <img class="avatar" src="/assets/henry.jpg" alt="Henry Lee">
    <div>
      <div class="chat-head-name">Henry Lee</div>
      <div class="chat-head-sub"><span class="dot"></span>Tokio Marine · Insurance Advisor</div>
    </div>
    <button class="reset-btn" onclick="startOver()">Start over</button>
  </div>

  <div class="thread" id="thread"></div>
  <div class="footer-note">Not Tokio Marine's official policy portal · Managed by Henry Lee</div>
</div>

<script>
// ═══════════ PRICING (verified against Explorer.pdf policy wording) ═══════════
const PREMIUMS = {
  '1': {
    adult:  { basic:[47,68,110,144,34,365],    essential:[58,84,135,179,44,455],    deluxe:[86,130,187,238,58,627]    },
    senior: { basic:[128,192,300,395,95,1031],  essential:[161,237,368,483,115,1264], deluxe:[185,277,412,531,127,1408] },
    family: { basic:[120,173,278,365,85,924],   essential:[149,216,343,455,111,1114], deluxe:[219,331,476,605,148,1550] }
  },
  '2': {
    adult:  { basic:[71,102,164,216,50,506],    essential:[83,123,198,265,66,650],    deluxe:[121,176,260,334,83,851]   },
    senior: { basic:[192,287,449,592,143,1432], essential:[237,353,548,721,173,1747], deluxe:[271,401,601,779,187,1920] },
    family: { basic:[178,258,415,546,128,1281], essential:[213,314,505,673,166,1525], deluxe:[308,449,660,847,209,2033] }
  },
  '3': {
    adult:  { basic:[175,253,408,538,126,1137],  essential:[215,310,496,705,164,1438],  deluxe:[324,466,671,899,212,2006]  },
    senior: { basic:[478,716,1121,1478,357,3218], essential:[583,871,1360,1792,432,3907], deluxe:[688,1021,1525,1972,477,4447] },
    family: { basic:[441,641,1033,1362,319,2875], essential:[502,754,1231,1651,415,3358], deluxe:[779,1149,1674,2140,536,4796] }
  },
  D: {
    adult:  [23,30,45,60,15,230],
    senior: [62,83,124,165,41,620],
    family: [57,76,114,152,38,570]
  }
};
function getBracket(table, days, annual) {
  if (annual) return table[5];
  if (days <= 5)  return table[0];
  if (days <= 10) return table[1];
  if (days <= 18) return table[2];
  if (days <= 31) return table[3];
  const extraWeeks = Math.ceil((days - 31) / 7);
  return table[3] + extraWeeks * table[4];
}
function applyTax(base, isDomestic) {
  const afterSST = isDomestic ? Math.round(base * 1.08 * 100) / 100 : base;
  const stampDuty = afterSST >= 150 ? 10 : 0;
  return Math.round((afterSST + stampDuty) * 100) / 100;
}
function applyGroupDiscount(base, policyType, adults) {
  if (policyType === 'family' || adults < 2) return base;
  return Math.round(base * 0.95 * 100) / 100;
}
function calcPremium(S) {
  const annual = S.tripType === 'annual';
  const days = annual ? 365 : S.days;
  const isDomestic = S.area === 'D';
  const out = { basic:0, essential:0, deluxe:0 };
  if (isDomestic) {
    let t;
    if (S.policyType === 'family') t = getBracket(PREMIUMS.D.family, days, annual);
    else t = getBracket(PREMIUMS.D.adult, days, annual) * S.adults + getBracket(PREMIUMS.D.senior, days, annual) * S.seniors;
    const base = applyGroupDiscount(Math.round(t * 100) / 100, S.policyType, S.adults);
    ['basic','essential','deluxe'].forEach(p => out[p] = applyTax(base, true));
  } else {
    const at = PREMIUMS[S.area];
    ['basic','essential','deluxe'].forEach(p => {
      let t;
      if (S.policyType === 'family') t = getBracket(at.family[p], days, annual);
      else t = getBracket(at.adult[p], days, annual) * S.adults + getBracket(at.senior[p], days, annual) * S.seniors;
      const base = applyGroupDiscount(Math.round(t * 100) / 100, S.policyType, S.adults);
      out[p] = applyTax(base, false);
    });
  }
  return out;
}
function fmtDate(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function paxStr(S){
  const p=[];
  if(S.adults>0)p.push(S.adults+(S.adults>1?' adults':' adult'));
  if(S.seniors>0)p.push(S.seniors+(S.seniors>1?' seniors':' senior'));
  if(S.children>0)p.push(S.children+(S.children>1?' children':' child'));
  return p.join(', ');
}
// Full breakdown for the chosen plan — mirrors calcPremium's formula exactly, used for the quote submission payload.
function calcDetail(S, plan){
  const annual = S.tripType==='annual';
  const days = annual ? 365 : S.days;
  const isDomestic = S.area==='D';
  let rawBase;
  if (isDomestic){
    rawBase = S.policyType==='family'
      ? getBracket(PREMIUMS.D.family, days, annual)
      : getBracket(PREMIUMS.D.adult, days, annual) * S.adults + getBracket(PREMIUMS.D.senior, days, annual) * S.seniors;
  } else {
    const at = PREMIUMS[S.area];
    rawBase = S.policyType==='family'
      ? getBracket(at.family[plan], days, annual)
      : getBracket(at.adult[plan], days, annual) * S.adults + getBracket(at.senior[plan], days, annual) * S.seniors;
  }
  rawBase = Math.round(rawBase*100)/100;
  const groupEligible = S.policyType!=='family' && S.adults>=2;
  const base = groupEligible ? Math.round(rawBase*0.95*100)/100 : rawBase;
  const discountAmt = Math.round((rawBase-base)*100)/100;
  const afterSST = isDomestic ? Math.round(base*1.08*100)/100 : base;
  const sstAmt = isDomestic ? Math.round((afterSST-base)*100)/100 : 0;
  const stampAmt = afterSST>=150 ? 10 : 0;
  const total = Math.round((afterSST+stampAmt)*100)/100;
  return { base, discountAmt, sstAmt, stampAmt, total };
}
// NRIC helpers — same logic as the live site.
function fmtNRICStr(v){
  let d=v.replace(/\D/g,'').slice(0,12);
  if(d.length>6)d=d.slice(0,6)+'-'+d.slice(6);
  if(d.length>9)d=d.slice(0,9)+'-'+d.slice(9);
  return d;
}
function parseNRICInfo(nric){
  const raw=nric.replace(/\D/g,'');
  if(raw.length<12) return null;
  const yy=raw.slice(0,2),mm=raw.slice(2,4),dd=raw.slice(4,6);
  const yr=(parseInt(yy)<=parseInt(new Date().getFullYear().toString().slice(2))?'20':'19')+yy;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const mi=parseInt(mm)-1;
  if(mi<0||mi>11) return null;
  return { dob:`${dd} ${months[mi]} ${yr}`, gender: parseInt(raw[11])%2===1?'Male':'Female' };
}

// ═══════════ CONVERSATION ENGINE ═══════════
const S = { tripType:'single', policyType:'individual', adults:1, seniors:0, children:0, area:'', dateFrom:'', dateTo:'', days:0, annualStart:'', annualEnd:'', plan:'' };
const thread = document.getElementById('thread');
const todayStr = new Date().toISOString().split('T')[0];

function scrollDown(){ window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); }

function sayTheirs(html, delay=520){
  return new Promise(resolve=>{
    const typingRow=document.createElement('div');
    typingRow.className='row theirs';
    typingRow.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    thread.appendChild(typingRow); scrollDown();
    setTimeout(()=>{
      typingRow.remove();
      const row=document.createElement('div'); row.className='row theirs';
      row.innerHTML=`<div class="bubble">${html}</div>`;
      thread.appendChild(row); scrollDown();
      resolve();
    }, delay);
  });
}
function sayMine(html){
  const row=document.createElement('div'); row.className='row mine';
  row.innerHTML=`<div class="bubble">${html}</div>`;
  thread.appendChild(row); scrollDown();
}
function showWidget(html){
  const div=document.createElement('div'); div.className='widget'; div.id='activeWidget';
  div.innerHTML=html; thread.appendChild(div); scrollDown();
  return div;
}
function clearWidget(){ const w=document.getElementById('activeWidget'); if(w) w.remove(); }

let widgetCounter=0;
function showTextWidget(opts){
  const id='wText'+(++widgetCounter);
  const inputTag = opts.multiline
    ? `<textarea id="${id}" placeholder="${opts.placeholder||''}"></textarea>`
    : `<input type="${opts.type||'text'}" id="${id}" placeholder="${opts.placeholder||''}" ${opts.maxlength?`maxlength="${opts.maxlength}"`:''} autocomplete="off">`;
  const div=showWidget(`
    ${opts.hint?`<div class="widget-hint">${opts.hint}</div>`:''}
    <div class="textfield-row">
      ${inputTag}
      <button class="send-btn" id="${id}send" disabled>→</button>
    </div>`);
  const input=document.getElementById(id), btn=document.getElementById(id+'send');
  const validate = opts.validate || (v=>v.trim().length>0);
  const check=()=>{
    if(opts.format){ const f=opts.format(input.value); if(f!==input.value) input.value=f; }
    btn.disabled = !validate(input.value);
  };
  if (opts.value){ input.value=opts.value; check(); }
  input.addEventListener('input', check);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !opts.multiline && !btn.disabled){ e.preventDefault(); btn.click(); } });
  btn.addEventListener('click', ()=>{ if(!btn.disabled) opts.onSend(input.value); });
  setTimeout(()=>input.focus(), 50);
  return div;
}

const AREA_LABELS = { D:'Domestic', '1':'Area 1 — Asia-Pacific', '2':'Area 2 — Worldwide excl. USA/Canada', '3':'Area 3 — Worldwide' };

// ═══════════ STEP HISTORY (Back / Start over) ═══════════
let history=[];
function snapshotState(){
  const {paymentSlip, ...rest} = S;
  return {
    S: JSON.parse(JSON.stringify(rest)),
    travellerData: JSON.parse(JSON.stringify(travellerData)),
    travellers: JSON.parse(JSON.stringify(travellers)),
    curT
  };
}
function restoreState(snap){
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, snap.S);
  travellerData = snap.travellerData;
  travellers = snap.travellers;
  curT = snap.curT;
}
// The only way any step should move to the next one: records where we are now, then runs it.
function enterStep(fn){
  history.push({ threadLen: thread.children.length, snap: snapshotState(), fn });
  fn();
}
function goBack(){
  if (history.length<=1){ window.location.href='/'; return; }
  history.pop();
  const cp=history[history.length-1];
  restoreState(cp.snap);
  while (thread.children.length > cp.threadLen) thread.lastElementChild.remove();
  cp.fn();
}
function startOver(){
  if (history.length>2 && !confirm('Start over? This clears your answers so far.')) return;
  thread.innerHTML='';
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S, { tripType:'single', policyType:'individual', adults:1, seniors:0, children:0, area:'', dateFrom:'', dateTo:'', days:0, annualStart:'', annualEnd:'', plan:'' });
  travellerData=[]; travellers=[]; curT=0; history=[];
  enterStep(askArea);
}

async function start(){ enterStep(askArea); }

async function askArea(){
  await sayTheirs("Hi! I'm Henry — I'll get you a quote in under a minute. Where are you headed?", 300);
  showWidget(`
    <div class="chiprow">
      <button class="chip" onclick="pickArea('D')">Domestic<span class="sub">Within Malaysia</span></button>
      <button class="chip" onclick="pickArea('1')">Area 1<span class="sub">Japan, China, Aus & more</span></button>
      <button class="chip" onclick="pickArea('2')">Area 2<span class="sub">Worldwide excl. US/Canada</span></button>
      <button class="chip" onclick="pickArea('3')">Area 3<span class="sub">Worldwide incl. US/Canada</span></button>
    </div>`);
}

async function pickArea(area){
  S.area = area;
  clearWidget();
  sayMine(AREA_LABELS[area]);
  enterStep(askTripType);
}
async function askTripType(){
  await sayTheirs('Single trip, or annual multi-trip cover?');
  showWidget(`
    <div class="chiprow">
      <button class="chip" onclick="pickTripType('single')">Single Trip</button>
      <button class="chip" onclick="pickTripType('annual')">Annual</button>
    </div>`);
}

async function pickTripType(type){
  S.tripType = type;
  clearWidget();
  sayMine(type==='single' ? 'Single Trip' : 'Annual');
  if (type==='single') enterStep(askDatesSingle);
  else enterStep(askDatesAnnual);
}
async function askDatesSingle(){
  await sayTheirs('When are you travelling?');
  showWidget(`
    <div class="datefield-row">

  showWidget(`<div class="chiprow"><button class="chip" onclick="agreeAndSubmit()" style="border-color:var(--wa);color:var(--wa)">I agree — submit application</button></div>`);
}
function buildPayload(){
  const proposerName = S.forOther ? S.policyholderName : (travellerData[0]?.fullName || '');
  const travellersOut = travellerData.map((t,i)=>({
    fullName:t.fullName, idNumber:t.idNumber||'', nationality:t.nationality||'MY',
    dateOfBirth:t.dateOfBirth||'', gender:(t.gender||'').toLowerCase(), ageBand:t.ageBand,
    occupation: (i===0 && !S.forOther) ? S.occupation : '',
    address: (i===0 && !S.forOther) ? S.address : ''
  }));
  const d=S.detail;
  const items=[{ label:`${S.plan.charAt(0).toUpperCase()+S.plan.slice(1)} Plan · ${paxStr(S)}`, value:d.base }];
  if (d.discountAmt>0) items.push({label:'5% Group Discount', value:-d.discountAmt});
  if (d.sstAmt>0) items.push({label:'8% Service Tax', value:d.sstAmt});
  items.push({label:'Stamp Duty', value:d.stampAmt});

  return {
    source:'chat',
    proposer:{ name:proposerName, mobile:S.mobile, email:S.email, occupation:S.occupation, address:S.address, sameAsFirstTraveller: !S.forOther },
    product:{
      insuranceType:S.tripType, policyType:S.policyType,
      coverageArea:{D:'domestic','1':'area1','2':'area2','3':'area3'}[S.area],
      departureDate: S.tripType==='annual' ? fmtDate(S.annualStart) : fmtDate(S.dateFrom),
      returnDate: S.tripType==='annual' ? fmtDate(S.annualEnd) : fmtDate(S.dateTo),
      selectedPlan:S.plan
    },
    quote:{ total:d.total, items },
    paymentMethod:S.payMethod,
    insuredTravellers:travellersOut,
    nominees: S.nominee ? [{travellerIndex:0, name:S.nominee.name, idNumber:S.nominee.idNumber||'', relationship:S.nominee.relationship, share:S.nominee.share}] : [],
    bankDetails: S.bank ? [{travellerIndex:0, travellerName:travellerData[0]?.fullName||'', bankName:S.bank.bankName, bankAccountNumber:S.bank.bankAccountNumber, bankAccountType:'Savings'}] : [],
    flights: S.flight ? [S.flight] : []
  };
}
async function agreeAndSubmit(){
  clearWidget(); sayMine('I agree — submit application');
  await sayTheirs('Submitting…', 250);
  const payload=buildPayload();
  const fd=new FormData();
  fd.append('submission', JSON.stringify(payload));
  if (S.paymentSlip) fd.append('paymentSlip', S.paymentSlip);
  try{
    const res=await fetch('/api/submit', {method:'POST', body:fd});
    const data=await res.json();
    if (!res.ok){
      await sayTheirs(`Something went wrong: ${data.error || 'please try again.'}`);
      showWidget(`<div class="chiprow"><button class="chip" onclick="agreeAndSubmit()">Try again</button></div>`);
      return;
    }
    showSuccess();
  }catch(e){
    await sayTheirs('Network error — please check your connection and try again, or WhatsApp me directly.');
    showWidget(`<div class="chiprow"><button class="chip" onclick="agreeAndSubmit()">Try again</button></div>`);
  }
}
async function showSuccess(){
  await sayTheirs("All submitted! I'll review this and follow up shortly. Your cover note will be sent once your payment is received and confirmed — usually within 2 working hours. Cover only begins once payment is received, so please avoid non-refundable bookings until you've received it.", 500);
  await sayTheirs("Keep these for a smooth claim: original receipts, medical reports/certificates, boarding passes, and any police or authority reports.", 500);
  await sayTheirs("And if anything happens overseas — call our 24-Hour Travel Assistance on <strong>+603 7628 3877</strong> before hospital admission or evacuation, so it's arranged cashless. General Customer Service: 1800 88 0812.", 500);
}

start();
</script>
